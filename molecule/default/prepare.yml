---
- name: Prepare
  hosts: all
  become: true

  tasks:
    - name: Install Python 3 | Rocky/RHEL 9+
      when: ansible_facts['os_family'] == "RedHat"
      package:
        name: "{{ item }}"
        state: present
      with_items:
        - python3
        - python3-devel

    - name: Install Python 3 | Debian
      when: ansible_facts['os_family'] == "Debian"
      package:
        name: "{{ item }}"
        state: present
      with_items:
        - python3
        - python3-dev
        - python3-packaging
        - python3-venv

    - name: Debian - Install Apache package
      when: ansible_facts['os_family'] == "Debian"
      block:
        - name: Debian - Install Apache
          apt:
            name: apache2
            state: present
            update_cache: true

        - name: Debian - Enable a2enmod rewrite module
          community.general.apache2_module:
            name: rewrite
            state: present

        - name: Debian - Restart Apache service
          service:
            name: apache2
            state: restarted
            enabled: true

    - name: RedHat - Install Apache
      when: ansible_facts['os_family'] == "RedHat"
      block:
        - name: RedHat - Install Apache package
          yum:
            name: httpd
            state: present

        - name: Restart and Enable Apache service
          service:
            name: httpd
            state: started
            enabled: true
